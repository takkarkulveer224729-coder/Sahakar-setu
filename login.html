<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sahkar Setu Login</title><style>body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0}.box{max-width:430px;margin:50px auto;background:#fff;border:1px solid #222;padding:24px;box-sizing:border-box}img{width:110px;height:110px;object-fit:contain;display:block;margin:auto}h2{text-align:center;margin:8px 0 3px}p{text-align:center;color:#555;font-size:13px}label{font-weight:700;font-size:13px}input,button{width:100%;box-sizing:border-box;padding:11px;margin:7px 0 14px;border:1px solid #777}button{background:#111;color:#fff;font-weight:700;cursor:pointer}.err{border:1px solid #900;padding:9px;color:#900;font-size:13px}</style></head><body><div class="box"><img src="/static/logo.png"><h2>COOP FARIDKOT</h2><p>KCC Mobile Number Update • Sahkar Setu Portal</p>{% with messages=get_flashed_messages(category_filter=['error']) %}{% for m in messages %}<div class="err">{{m}}</div>{% endfor %}{% endwith %}<form method="post"><label>SOL ID</label><input name="sol" maxlength="4" placeholder="0301 / 0302 … 0325" required><label>Password</label><input type="password" name="password" required><button>LOGIN</button></form></div></body></html>
